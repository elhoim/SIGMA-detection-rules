title: Massive remote service creation via named pipes (TChopper, CME) - count
id: 80056060-0ade-4277-b121-4f5c6743e031
status: experimental
author: mdecrevoisier
correlation:
  type: value_count
  rules:
    - win_os_service_remote_creation_via_named_pipes_cme_tchopper
  group-by:
    - IpAddress
  timespan: 1h # v1 rule had no timeframe: 1h assumed, please adjust
  condition:
    gt: 20
    field: Computer
level: high
